name: Moyu Cloud Platform CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test-and-tag:
    name: Build, Test & Auto-Tag Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Java JUnit 5 Unit Tests
        run: mvn clean test

      - name: Package Spring Boot Application (JAR)
        run: mvn clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Node.js Tests
        run: npm test

      - name: Automated Dynamic Tagging & GitHub Sync
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_TIME=$(date +'%Y%m%d-%H%M%S')
          TAG_NAME="v1.0.1-build-${BUILD_TIME}"
          echo "Auto-generating release tag: ${TAG_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Automated build tag generated by GitHub Actions on ${BUILD_TIME}"
          git push origin "${TAG_NAME}" || true
